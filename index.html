<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROM Build Simulator</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1l7 7-7 7-7-7z%22 fill=%22%23f2c14e%22/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">◆</span>
    <div>
      <h1>ROM Build Simulator</h1>
      <p class="sub">Ragnarok M: Eternal Love · client 1.0.0.8 data · the client's own formulas</p>
    </div>
  </div>
  <div class="build-bar">
    <label class="field grow">Class
      <select id="cls"></select>
    </label>
    <label class="field">Base Lv
      <input id="base" type="number" min="1" step="1">
    </label>
    <label class="field">Job Lv <span id="jobmax" class="hint"></span>
      <input id="job" type="number" min="1" step="1">
    </label>
    <label class="field">Gender
      <select id="gender"><option value="1">Male</option><option value="2">Female</option></select>
    </label>
    <div class="actions">
      <button id="share" class="btn" title="Copy a link to this build">Share</button>
      <button id="saves" class="btn" title="Save or load builds in this browser">Builds</button>
      <button id="reset" class="btn ghost" title="Start this class again">Reset</button>
    </div>
  </div>
</header>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <p id="loadmsg">Loading the game data…</p>
</div>

<main id="app" class="app" hidden>
  <section class="work">
    <nav class="tabs" id="tabs">
      <button data-tab="stats" class="on">Stats</button>
      <button data-tab="skills">Skills</button>
      <button data-tab="equip">Equipment</button>
      <button data-tab="runes">Runes</button>
      <button data-tab="gems">Gems</button>
      <button data-tab="more">More</button>
    </nav>
    <div class="panel" id="tab-stats"></div>
    <div class="panel" id="tab-skills" hidden></div>
    <div class="panel" id="tab-equip" hidden></div>
    <div class="panel" id="tab-runes" hidden></div>
    <div class="panel" id="tab-gems" hidden></div>
    <div class="panel" id="tab-more" hidden></div>
  </section>
  <aside class="result" id="result"></aside>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><h2 id="modal-title"></h2><button class="x" id="modal-close" aria-label="Close">×</button></div>
    <div id="modal-body"></div>
  </div>
</div>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/fengari-web.js"></script>
<script src="js/lua.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
